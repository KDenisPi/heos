[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heos-home"
version = "0.1.1"
description = "Local-only controller for HEOS devices (Marantz PM7000N and friends)"
requires-python = ">=3.11"
dependencies = [
    # Lowest tested versions = Debian 13 (trixie); see deploy/requirements.txt.
    "fastapi>=0.115",
    "pydantic>=2.10",
    "uvicorn>=0.32",
    "websockets>=15",
    "httpx>=0.28",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
heos-home = "heos_home.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
